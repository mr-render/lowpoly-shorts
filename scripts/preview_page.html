<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Preview</title>
<style>
  :root {
    --bg: #0d0e10; --panel: #15171a; --panel2: #1b1e22; --line: #262a30; --line2: #33383f;
    --text: #ebe8e3; --muted: #8d939a; --dim: #5e646b;
    --accent: #f5c518; --accent-ink: #1a1500; --ok: #3fb37f; --bad: #e5534b; --new: #4aa3ff;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

  /* top bar */
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .title { font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .meta b { color: var(--text); font-weight: 600; }
  .btn { border: 1px solid var(--line2); background: var(--panel2); padding: 7px 12px; border-radius: 8px; white-space: nowrap; }
  .btn:hover { border-color: #4a5058; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }

  /* main */
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; padding: 14px; gap: 10px; }
  .screen { position: relative; height: 100%; max-height: calc(100vh - 230px); aspect-ratio: 9 / 16; background: #000;
            border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  video { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: contain; background: #000; }
  .hud { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; pointer-events: none; }
  .chip { font: 600 11.5px var(--mono); background: rgba(0,0,0,.66); border: 1px solid rgba(255,255,255,.12);
          padding: 3px 7px; border-radius: 6px; }
  .chip.new { color: var(--new); border-color: rgba(74,163,255,.5); }
  .empty[hidden] { display: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }
  .transport { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .transport .time { font: 13px var(--mono); color: var(--text); min-width: 150px; text-align: center; }
  .iconbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2);
             display: grid; place-items: center; }
  .iconbtn svg { width: 16px; height: 16px; fill: currentColor; }
  select.btn { padding: 6px 8px; }

  /* side panel */
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .composer { padding: 14px; border-bottom: 1px solid var(--line); }
  .composer .at { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .composer .at b { color: var(--accent); font: 600 12.5px var(--mono); }
  textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--text);
             border: 1px solid var(--line2); border-radius: 8px; padding: 9px 10px; font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .hint { color: var(--dim); font-size: 12px; }
  .tabs { display: flex; gap: 4px; padding: 10px 14px 0; }
  .tab { border: 0; background: none; padding: 6px 10px; border-radius: 7px; color: var(--muted); }
  .tab.on { background: var(--panel2); color: var(--text); }
  .list { flex: 1; overflow: auto; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .note { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 10px 11px; }
  .note.active { border-color: var(--accent); }
  .note .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .note .tc { font: 600 12px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; }
  .note .shot { font: 12px var(--mono); color: var(--muted); }
  .note .sp { flex: 1; }
  .note .txt { white-space: pre-wrap; word-break: break-word; }
  .note .reply { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line2); color: var(--muted); font-size: 13px; }
  .note .reply::before { content: "Claude: "; color: var(--ok); font-weight: 600; }
  .note.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--dim); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line2); color: var(--muted); }
  .badge.done { color: var(--ok); border-color: rgba(63,179,127,.45); }
  .none { color: var(--dim); text-align: center; padding: 30px 10px; }
  .job { border-top: 1px solid var(--line); padding: 10px 14px; font: 11.5px/1.5 var(--mono); color: var(--muted);
         max-height: 170px; overflow: auto; white-space: pre-wrap; display: none; }
  .job.show { display: block; }
  .job .head { color: var(--text); font-family: var(--sans); font-size: 12.5px; margin-bottom: 4px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line2); border-top-color: var(--accent);
          border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* timeline */
  .timeline { border-top: 1px solid var(--line); padding: 10px 16px 14px; user-select: none; }
  .tl { position: relative; height: 62px; cursor: pointer; }
  .pins { position: absolute; left: 0; right: 0; top: 0; height: 16px; }
  .pin { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50% 50% 50% 0;
         transform: rotate(-45deg); background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
  .pin.done { background: var(--ok); opacity: .7; }
  .shots { position: absolute; left: 0; right: 0; top: 18px; height: 40px; display: flex; }
  .shotseg { position: relative; height: 100%; border-right: 2px solid var(--bg); background: var(--panel2);
             overflow: hidden; padding: 5px 6px; font: 11px var(--mono); color: var(--muted); }
  .shotseg:nth-child(even) { background: #1f2328; }
  .shotseg.cur { background: #2b2f35; color: var(--text); }
  .shotseg.new { box-shadow: inset 0 -3px 0 var(--new); }
  .shotseg .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .shotseg .ct { color: var(--accent); font-weight: 700; }
  .phead { position: absolute; top: 14px; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; }
  .phead::before { content: ""; position: absolute; top: -5px; left: -4px; border: 5px solid transparent; border-top-color: var(--accent); }
  .legend { display: flex; gap: 16px; margin-top: 6px; color: var(--dim); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 3px; background: var(--new); vertical-align: middle; margin-right: 5px; }
  .kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    .screen { max-height: 55vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title" id="title">Preview</div>
    <div class="meta" id="meta">Loading…</div>
    <button class="btn" id="btnRender" title="Re-render the shots that changed since the last preview">Update preview</button>
    <button class="btn primary" id="btnFinal" title="Approve and render the final version in full quality">Approve &amp; render final</button>
  </header>

  <main>
    <section class="stage">
      <div class="screen">
        <video id="v" playsinline preload="auto"></video>
        <div class="hud"><span class="chip" id="hudShot">–</span><span class="chip" id="hudTime">00:00.00</span></div>
        <div class="empty" id="empty" hidden>No preview yet.<br>Run: python preview.py &lt;short&gt; render</div>
      </div>
      <div class="transport">
        <button class="iconbtn" id="prevShot" title="Previous shot (Shift+←)"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
        <button class="iconbtn" id="stepB" title="Back one frame (←)"><svg viewBox="0 0 16 16"><path d="M12 2v12L4 8z"/></svg></button>
        <button class="iconbtn" id="play" title="Play / pause (Space)"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2v12l10-6z"/></svg></button>
        <button class="iconbtn" id="stepF" title="Forward one frame (→)"><svg viewBox="0 0 16 16"><path d="M4 2v12l8-6z"/></svg></button>
        <button class="iconbtn" id="nextShot" title="Next shot (Shift+→)"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
        <span class="time" id="time">00:00.00 / 00:00.00</span>
        <select class="btn" id="rate" title="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option></select>
      </div>
    </section>

    <aside>
      <div class="composer">
        <div class="at">Note at <b id="atTime">00:00.00</b> · <span id="atShot">–</span></div>
        <textarea id="noteText" placeholder="What should change here? e.g. Make him look left before the doors close."></textarea>
        <div class="row">
          <span class="hint"><span class="kbd">N</span> write · <span class="kbd">Enter</span> add · <span class="kbd">Shift+Enter</span> new line</span>
          <button class="btn primary small" id="addNote">Add note</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab on" data-f="open" id="tabOpen">Open</button>
        <button class="tab" data-f="done" id="tabDone">Done</button>
        <button class="tab" data-f="all" id="tabAll">All</button>
      </div>
      <div class="list" id="list"></div>
      <div class="job" id="job"></div>
    </aside>
  </main>

  <div class="timeline">
    <div class="tl" id="tl">
      <div class="pins" id="pins"></div>
      <div class="shots" id="shots"></div>
      <div class="phead" id="head"></div>
    </div>
    <div class="legend">
      <span><i></i>re-rendered in the last update</span>
      <span>Click the timeline to jump · <span class="kbd">Space</span> play · <span class="kbd">←</span><span class="kbd">→</span> frame · <span class="kbd">Shift</span>+arrows shot</span>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const v = $("v");
let S = { meta: {}, notes: { notes: [] }, job: {}, log: [] };
let version = null, filter = "open", lastJobRunning = false;

const fmt = (t) => {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(2).padStart(5, "0");
};
const ago = (ts) => {
  if (!ts) return "";
  const d = Math.round(Date.now() / 1000 - ts);
  if (d < 60) return d + " s ago";
  if (d < 3600) return Math.round(d / 60) + " min ago";
  return Math.round(d / 3600) + " h ago";
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shots = () => S.meta.shots || [];
const dur = () => S.meta.duration || v.duration || 0;
const frameDur = () => (S.meta.step || 2) / (S.meta.fps || 24);
const shotAt = (t) => shots().find((s) => t >= s.t0 && t < s.t1) || shots()[shots().length - 1];

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}

/* ---------- state polling ---------- */
async function poll() {
  try {
    S = await api("/api/state");
  } catch (e) { $("meta").textContent = "Server stopped. Start it again: python preview.py <short> serve"; return; }
  const m = S.meta || {};
  $("title").textContent = S.name || "Preview";
  document.title = (S.name || "Short") + " · Preview";
  if (m.version && m.version !== version) loadVideo(m.version);
  $("empty").hidden = !!m.version;
  if (m.version) {
    const n = Object.keys(m.rerendered || {}).length;
    $("meta").innerHTML = `<b>${m.res ? m.res.join("×") : ""}</b> · ${Math.round((m.fps || 24) / (m.step || 2))} fps · ${shots().length} shots · ` +
      `updated ${ago(m.rendered_at)} in <b>${m.seconds ? m.seconds.total : "?"} s</b> · ` +
      (n ? `<b>${n}</b> shot${n > 1 ? "s" : ""} re-rendered` : "nothing changed");
  }
  $("btnFinal").hidden = !S.has_final;
  $("btnRender").disabled = $("btnFinal").disabled = !!(S.job && S.job.running);
  if (S.notes.approved && !(S.job && S.job.running)) $("btnFinal").textContent = "Approved ✓ render again";
  renderJob();
  renderTimeline();
  renderNotes();
}

function loadVideo(ver) {
  const t = v.currentTime, paused = v.paused || version === null;
  version = ver;
  v.src = "/preview.mp4?v=" + ver;
  v.addEventListener("loadedmetadata", () => {
    v.currentTime = Math.min(t, v.duration || t);
    if (!paused) v.play();
  }, { once: true });
}

function renderJob() {
  const j = S.job || {}, el = $("job");
  if (!j.name) { el.classList.remove("show"); return; }
  el.classList.add("show");
  const label = j.name === "final" ? "Final render" : "Preview update";
  const status = j.running ? `<span class="spin"></span>${label} running…` : j.ok ? `✓ ${label} finished` : `✕ ${label} failed`;
  el.innerHTML = `<div class="head">${status}</div>` + esc((S.log || []).slice(-14).join("\n"));
  el.scrollTop = el.scrollHeight;
  lastJobRunning = j.running;
}

/* ---------- timeline ---------- */
function renderTimeline() {
  const D = dur();
  if (!D) return;
  const redo = S.meta.rerendered || {};
  const counts = {};
  S.notes.notes.filter((n) => n.status === "open").forEach((n) => (counts[n.shot] = (counts[n.shot] || 0) + 1));
  const html = shots().map((s, i) => {
    const w = ((s.t1 - s.t0) / D) * 100;
    const c = counts[s.name] ? ` <span class="ct">●${counts[s.name]}</span>` : "";
    return `<div class="shotseg${redo[s.name] ? " new" : ""}" data-i="${i}" style="width:${w}%" title="${esc(s.name)} · ${fmt(s.t0)}–${fmt(s.t1)}${redo[s.name] ? " · re-rendered: " + esc(redo[s.name]) : ""}">` +
      `<span class="nm">${esc(s.name)}${c}</span></div>`;
  }).join("");
  if ($("shots").dataset.h !== html) { $("shots").innerHTML = html; $("shots").dataset.h = html; }
  const pins = S.notes.notes.map((n) => `<div class="pin${n.status === "done" ? " done" : ""}" style="left:${(n.t / D) * 100}%" title="#${n.id} ${esc(n.text)}"></div>`).join("");
  if ($("pins").dataset.h !== pins) { $("pins").innerHTML = pins; $("pins").dataset.h = pins; }
}

function tick() {
  const t = v.currentTime || 0, D = dur();
  const s = shotAt(t);
  $("time").textContent = fmt(t) + " / " + fmt(D);
  $("hudTime").textContent = fmt(t);
  $("atTime").textContent = fmt(t);
  $("hudShot").textContent = s ? s.name : "–";
  $("hudShot").className = "chip" + (s && (S.meta.rerendered || {})[s.name] ? " new" : "");
  $("atShot").textContent = s ? s.name : "–";
  if (D) $("head").style.left = (t / D) * 100 + "%";
  const i = shots().indexOf(s);
  document.querySelectorAll(".shotseg").forEach((el) => el.classList.toggle("cur", +el.dataset.i === i));
  document.querySelectorAll(".note").forEach((el) => el.classList.toggle("active", Math.abs(+el.dataset.t - t) < frameDur() * 1.5));
  $("playIcon").innerHTML = v.paused ? '<path d="M4 2v12l10-6z"/>' : '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
  requestAnimationFrame(tick);
}

function seek(t) {
  v.currentTime = Math.max(0, Math.min(t, (v.duration || dur()) - 0.001));
}
function scrubAt(e) {
  const r = $("tl").getBoundingClientRect();
  seek(((e.clientX - r.left) / r.width) * dur());
}
let dragging = false;
$("tl").addEventListener("pointerdown", (e) => { dragging = true; $("tl").setPointerCapture(e.pointerId); v.pause(); scrubAt(e); });
$("tl").addEventListener("pointermove", (e) => dragging && scrubAt(e));
$("tl").addEventListener("pointerup", () => (dragging = false));

/* ---------- notes ---------- */
function renderNotes() {
  const all = S.notes.notes;
  const open = all.filter((n) => n.status === "open"), done = all.filter((n) => n.status !== "open");
  $("tabOpen").textContent = `Open (${open.length})`;
  $("tabDone").textContent = `Done (${done.length})`;
  $("tabAll").textContent = `All (${all.length})`;
  const list = (filter === "open" ? open : filter === "done" ? done : all).slice().sort((a, b) => a.t - b.t);
  const html = list.length ? list.map((n) => `
    <div class="note ${n.status}" data-t="${n.t}">
      <div class="top">
        <button class="tc" data-seek="${n.t}" title="Jump here">${fmt(n.t)}</button>
        <span class="shot">${esc(n.shot || "")}</span><span class="sp"></span>
        ${n.status === "open" ? `<span class="badge">open</span>` : `<span class="badge done">done</span>`}
      </div>
      <div class="txt">${esc(n.text)}</div>
      ${n.reply ? `<div class="reply">${esc(n.reply)}</div>` : ""}
      <div class="row">
        <span class="hint">#${n.id} · frame ${n.frame}</span>
        <span>
          <button class="btn small" data-status="${n.id}" data-to="${n.status === "open" ? "done" : "open"}">${n.status === "open" ? "Mark done" : "Reopen"}</button>
          <button class="btn small" data-del="${n.id}" title="Delete">✕</button>
        </span>
      </div>
    </div>`).join("")
    : `<div class="none">${filter === "open" ? "No open notes.<br>Pause on a moment you don't like and write what should change." : "Nothing here yet."}</div>`;
  if ($("list").dataset.h !== html) { $("list").innerHTML = html; $("list").dataset.h = html; }
}

$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.seek) { v.pause(); seek(+b.dataset.seek); }
  if (b.dataset.status) { await api("/api/notes/" + b.dataset.status, { status: b.dataset.to }); poll(); }
  if (b.dataset.del && confirm("Delete this note?")) { await api("/api/notes/" + b.dataset.del, { delete: true }); poll(); }
});
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  filter = t.dataset.f;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  renderNotes();
}));

async function addNote() {
  const text = $("noteText").value.trim();
  if (!text) return $("noteText").focus();
  await api("/api/notes", { t: v.currentTime || 0, text });
  $("noteText").value = "";
  filter = "open";
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x.dataset.f === "open"));
  poll();
}
$("addNote").addEventListener("click", addNote);
$("noteText").addEventListener("focus", () => v.pause());
$("noteText").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addNote(); }
  if (e.key === "Escape") $("noteText").blur();
});

/* ---------- transport ---------- */
const toggle = () => (v.paused ? v.play() : v.pause());
const step = (d) => { v.pause(); seek(v.currentTime + d * frameDur()); };
const jumpShot = (d) => {
  const s = shotAt(v.currentTime + 0.001), i = shots().indexOf(s);
  const target = d < 0 && v.currentTime - s.t0 > 0.3 ? s : shots()[Math.max(0, Math.min(shots().length - 1, i + d))];
  if (target) seek(target.t0 + 0.001);
};
$("play").addEventListener("click", toggle);
v.addEventListener("click", toggle);
$("stepB").addEventListener("click", () => step(-1));
$("stepF").addEventListener("click", () => step(1));
$("prevShot").addEventListener("click", () => jumpShot(-1));
$("nextShot").addEventListener("click", () => jumpShot(1));
$("rate").addEventListener("change", (e) => (v.playbackRate = +e.target.value));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (e.key === " " || e.key === "k") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); e.shiftKey ? jumpShot(-1) : step(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); e.shiftKey ? jumpShot(1) : step(1); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); $("noteText").focus(); }
});

$("btnRender").addEventListener("click", async () => { await api("/api/render", {}); poll(); });
$("btnFinal").addEventListener("click", async () => {
  const open = S.notes.notes.filter((n) => n.status === "open").length;
  if (open && !confirm(`${open} note${open > 1 ? "s are" : " is"} still open. Render the final anyway?`)) return;
  await api("/api/approve", { approved: true });
  await api("/api/final", {});
  poll();
});

poll();
setInterval(poll, 1500);
requestAnimationFrame(tick);
</script>
</body>
</html>
